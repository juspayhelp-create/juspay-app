<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background / Glow Filters -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="gold-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="inner-depth">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#022c22" flood-opacity="0.8" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>

    <!-- Gold Gradients for Metallic Rim & Bevels -->
    <linearGradient id="gold-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA771C" />
      <stop offset="75%" stop-color="#FDF0A6" />
      <stop offset="100%" stop-color="#8B5A00" />
    </linearGradient>

    <linearGradient id="gold-grad-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <linearGradient id="gold-bevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C3A00" />
      <stop offset="30%" stop-color="#B8860B" />
      <stop offset="70%" stop-color="#FFEAA7" />
      <stop offset="100%" stop-color="#734700" />
    </linearGradient>

    <!-- Emerald Gemstone Crystal Facet Gradients -->
    <linearGradient id="emerald-facet-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <linearGradient id="emerald-facet-light" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="emerald-facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="60%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <linearGradient id="emerald-facet-deep" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#011B14" />
    </linearGradient>

    <linearGradient id="emerald-facet-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="250" cy="250" r="180" fill="#10B981" opacity="0.18" filter="url(#emerald-glow)" />
  <circle cx="250" cy="250" r="120" fill="#F59E0B" opacity="0.1" filter="url(#emerald-glow)" />

  <g filter="url(#gold-shadow)">
    <!-- Base Outer Gold Hexagon Frame -->
    <!-- Top vertex: (250, 40), Top-right: (430, 145), Bottom-right: (430, 355), Bottom vertex: (250, 460), Bottom-left: (70, 355), Top-left: (70, 145) -->
    
    <!-- Outer Rim Shadow & Bevel -->
    <polygon points="250,32 442,142 442,358 250,468 58,358 58,142" fill="url(#gold-bevel)" stroke="#3D2600" stroke-width="3" />
    <polygon points="250,40 430,145 430,355 250,460 70,355 70,145" fill="url(#gold-grad-1)" stroke="#5C3A00" stroke-width="2" />
    
    <!-- Dark Inset Bed under facets -->
    <polygon points="250,54 416,150 416,350 250,446 84,350 84,150" fill="#011B14" stroke="url(#gold-grad-light)" stroke-width="3" />

    <!-- Center Gold Dividing Spine (Between J and P) -->
    <line x1="248" y1="54" x2="248" y2="446" stroke="url(#gold-bevel)" stroke-width="4" />
    <line x1="252" y1="54" x2="252" y2="446" stroke="url(#gold-grad-light)" stroke-width="2" />

    <!-- ============================================== -->
    <!-- LEFT HALF: THE "J" MONOGRAM (EMERALD & GOLD)   -->
    <!-- ============================================== -->
    <g id="letter-J">
      <!-- Top Left Outer Slanted Facet -->
      <polygon points="244,60 92,152 145,178 244,120" fill="url(#emerald-facet-light)" stroke="url(#gold-grad-1)" stroke-width="2.5" />
      
      <!-- Top Left Inner Corner -->
      <polygon points="244,120 145,178 145,240 244,180" fill="url(#emerald-facet-1)" stroke="url(#gold-grad-light)" stroke-width="1.5" />

      <!-- Left Vertical Outer Bar Upper -->
      <polygon points="92,152 145,178 145,280 92,280" fill="url(#emerald-facet-dark)" stroke="url(#gold-bevel)" stroke-width="2" />
      
      <!-- Left Outer Center Inset Triangles -->
      <polygon points="92,280 145,280 145,340 92,348" fill="url(#emerald-facet-deep)" stroke="url(#gold-grad-1)" stroke-width="2" />

      <!-- J Inward Arm / Hook Point (Golden Arrowhead / Wedge) -->
      <polygon points="92,280 175,280 145,240 92,280" fill="url(#gold-grad-1)" stroke="#5C3A00" stroke-width="2" />
      <polygon points="92,280 175,280 145,315" fill="url(#gold-grad-light)" stroke="#8B5A00" stroke-width="1.5" />

      <!-- Bottom Left Lower Facets of J -->
      <polygon points="92,348 145,340 185,385 105,370" fill="url(#emerald-facet-1)" stroke="url(#gold-grad-1)" stroke-width="2" />
      <polygon points="105,370 185,385 244,440 170,415" fill="url(#emerald-facet-dark)" stroke="url(#gold-bevel)" stroke-width="2" />
      <polygon points="170,415 244,440 244,380 185,385" fill="url(#emerald-facet-light)" stroke="url(#gold-grad-light)" stroke-width="1.5" />

      <!-- Bottom Triangle Wedge in J Base -->
      <polygon points="185,385 244,440 215,440" fill="url(#gold-grad-1)" stroke="#5C3A00" stroke-width="1.5" />
    </g>

    <!-- ============================================== -->
    <!-- RIGHT HALF: THE "P" MONOGRAM (EMERALD & GOLD)  -->
    <!-- ============================================== -->
    <g id="letter-P">
      <!-- Top Right Outer Slanted Facet -->
      <polygon points="256,60 408,152 355,178 256,120" fill="url(#emerald-facet-light)" stroke="url(#gold-grad-1)" stroke-width="2.5" />

      <!-- Top Right Upper Bar of P Loop -->
      <polygon points="256,120 355,178 355,235 256,175" fill="url(#emerald-facet-1)" stroke="url(#gold-grad-light)" stroke-width="1.5" />

      <!-- Outer Right Upper Curve of P -->
      <polygon points="408,152 408,270 355,235 355,178" fill="url(#emerald-facet-dark)" stroke="url(#gold-bevel)" stroke-width="2" />

      <!-- P Middle Horizontal Bridge -->
      <polygon points="256,260 408,270 355,305 256,305" fill="url(#emerald-facet-highlight)" stroke="url(#gold-grad-1)" stroke-width="2" />

      <!-- P Inner Loop Cutout / Window -->
      <polygon points="280,185 340,205 340,245 280,245" fill="#011A13" stroke="url(#gold-grad-light)" stroke-width="2.5" />

      <!-- Bitcoin Symbol Inside P Loop Window -->
      <g id="bitcoin-symbol" transform="translate(295, 200) scale(1.15)">
        <!-- Bitcoin 'B' in Polished Gold with 3D Bevel -->
        <!-- Double vertical lines top and bottom -->
        <line x1="8" y1="2" x2="8" y2="7" stroke="url(#gold-grad-light)" stroke-width="2" stroke-linecap="round" />
        <line x1="14" y1="2" x2="14" y2="7" stroke="url(#gold-grad-light)" stroke-width="2" stroke-linecap="round" />
        <line x1="8" y1="31" x2="8" y2="36" stroke="url(#gold-grad-light)" stroke-width="2" stroke-linecap="round" />
        <line x1="14" y1="31" x2="14" y2="36" stroke="url(#gold-grad-light)" stroke-width="2" stroke-linecap="round" />

        <!-- Main Body of B with dual rounded loops -->
        <path d="M 4 6 L 15 6 C 19 6 22 8 22 12 C 22 15 19 17.5 15 18 C 20 18.5 24 21 24 25.5 C 24 30 20 32 15 32 L 4 32 Z" 
              fill="url(#gold-grad-1)" 
              stroke="#5C3A00" 
              stroke-width="1.5" 
              filter="url(#gold-shadow)" />

        <!-- Inner negative cutouts of B -->
        <path d="M 9 10 L 14 10 C 16 10 18 11 18 13.5 C 18 16 16 17 14 17 L 9 17 Z" fill="#011A13" stroke="url(#gold-grad-light)" stroke-width="1" />
        <path d="M 9 21 L 15 21 C 17.5 21 19.5 22 19.5 25 C 19.5 28 17.5 28.5 15 28.5 L 9 28.5 Z" fill="#011A13" stroke="url(#gold-grad-light)" stroke-width="1" />
      </g>

      <!-- P Stem / Lower Right Diagonal Struts & Facets -->
      <polygon points="256,305 320,305 310,410 256,440" fill="url(#emerald-facet-dark)" stroke="url(#gold-bevel)" stroke-width="2" />
      <polygon points="320,305 355,305 390,360 350,420 310,410" fill="url(#emerald-facet-1)" stroke="url(#gold-grad-light)" stroke-width="2" />
      <polygon points="355,305 408,270 408,350 390,360" fill="url(#emerald-facet-deep)" stroke="url(#gold-bevel)" stroke-width="2" />

      <!-- Bottom Right Wing Facet -->
      <polygon points="408,350 350,420 390,360" fill="url(#emerald-facet-light)" stroke="url(#gold-grad-1)" stroke-width="1.5" />
      <polygon points="350,420 256,440 310,410" fill="url(#gold-grad-1)" stroke="#5C3A00" stroke-width="1.5" />
    </g>

    <!-- Specular Highlight Overlay Polygons (Glass reflection gleam) -->
    <polygon points="250,54 360,110 320,135 250,85" fill="#FFFFFF" opacity="0.3" />
    <polygon points="120,170 145,178 135,230 105,210" fill="#FFFFFF" opacity="0.25" />
    <polygon points="380,165 408,152 400,220 375,210" fill="#FFFFFF" opacity="0.25" />
  </g>
</svg>
