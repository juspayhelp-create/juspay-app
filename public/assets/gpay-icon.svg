<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <g transform="translate(150, 95)">
    <!-- Interlocking colorful GPay ribbon loops -->
    <!-- Blue loop (Top Left) -->
    <path
      d="M -48,-32 C -58,-18 -55,8 -40,24 L -15,48 L 5,28 L -20,4 C -28,-4 -28,-16 -20,-24 C -12,-32 0,-32 8,-24 L 28,-4 L 48,-24 L 28,-44 C 10,-60 -18,-60 -36,-44 Z"
      fill="#4285F4"
    />
    <!-- Green loop (Top Right) -->
    <path
      d="M -15,-48 C 0,-60 28,-58 44,-40 L 68,-15 L 48,5 L 24,-20 C 16,-28 4,-28 -4,-20 C -12,-12 -12,0 -4,8 L 20,32 L 0,52 L -20,32 C -36,14 -36,-14 -20,-32 Z"
      fill="#34A853"
    />
    <!-- Red loop (Right/Bottom) -->
    <path
      d="M 48,-15 C 58,-1 55,25 40,41 L 15,65 L -5,45 L 20,20 C 28,12 28,0 20,-8 C 12,-16 0,-16 -8,-8 L -28,12 L -48,-8 L -28,-28 C -10,-44 18,-44 36,-28 Z"
      fill="#EA4335"
    />
    <!-- Yellow loop (Bottom Left) -->
    <path
      d="M 15,65 C 0,77 -28,75 -44,57 L -68,32 L -48,12 L -24,37 C -16,45 -4,45 4,37 C 12,29 12,17 4,9 L -20,-15 L 0,-35 L 20,-15 C 36,3 36,31 20,49 Z"
      fill="#FBBC05"
    />
  </g>

  <!-- Google Pay Text -->
  <g font-family="system-ui, -apple-system, 'Google Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="46" fill="#3c4043" text-anchor="middle">
    <text x="150" y="235" letter-spacing="-0.5">Google Pay</text>
  </g>
</svg>
